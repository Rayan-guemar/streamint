{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stream'int - Page introuvable</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: black url("{% static 'img/erreur.gif' %}") center / cover no-repeat;
        }

        .message {
            background: rgba(0, 0, 0, 0.6);
            padding: 2rem 3rem;
            border-radius: 12px;
        }

        .numero {
            font-size: 5rem;
            font-weight: bold;
            margin: 0;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            background: white;
            color: black;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="message">
        <p class="numero">404</p>
        <h1>Page introuvable</h1>
        <p>Cette page n'existe pas ou la séance est terminée.</p>
        <a href="/">Retour à l'accueil</a>
    </main>
</body>

</html>
