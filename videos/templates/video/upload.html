<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Stream'int - Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>
    <h1>Uploader une vidéo</h1>

    <form method="POST" action="{% url 'handle_upload' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="video_file" accept="video/*" required>
        <button type="submit">Envoyer la vidéo</button>
    </form>

    <hr>

    <h2>Lecteur Vidéo</h2>
    <video id="video" controls width="640" height="360"></video>

    <h2>Vidéos disponibles (Clique pour charger)</h2>
    <ul>
        {% for video in videos %}
        <li>
            <button onclick="loadVideo('/media/hls/{{ video.title}}/master.m3u8')">
                ▶️ Lire {{ video.title }}, Status: {{ video.status }}
            </button>
        </li>
        {% empty %}
        <p>Aucune vidéo convertie pour le moment.</p>
        {% endfor %}
    </ul>

    <script>
        function loadVideo(videoSrc) {
            var video = document.getElementById('video');
            console.log(videoSrc)

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function (e, d) {
                    console.log("testa")
                    console.log("Manifest chargé avec succès ! Qualités dispo : ", d.levels);
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function (e, d) {
                    console.log("Manifest chargé avec succès ! Qualités dispo : ", d.levels);
                    console.log("test2")
                    video.play();
                });
            }
        }
    </script>
</body>

</html>
